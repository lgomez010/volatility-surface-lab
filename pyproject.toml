[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volatility-surface-lab"
version = "0.1.0"
description = "Volatility surface construction and calibration: implied vol extraction, SVI parameterization, Dupire local vol, Heston calibration, and rough Bergomi with Hurst estimation. Connections to log-correlated Gaussian fields and GMC."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Luis Gomez"},
]

dependencies = [
    "numpy>=1.26,<2.0",
    "scipy>=1.12,<2.0",
    "matplotlib>=3.8,<4.0",
    "pandas>=2.1,<3.0",
    "yfinance>=0.2.40,<1.0",
    "statsmodels>=0.14,<1.0",
    "scikit-learn>=1.4,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<6.0",
    "black>=24.0,<25.0",
    "mypy>=1.8,<2.0",
    "ruff>=0.2,<1.0",
]
notebooks = [
    "jupyter>=1.0,<2.0",
    "ipykernel>=6.29,<7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vollab*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
